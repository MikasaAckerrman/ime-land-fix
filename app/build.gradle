// IME Landscape Fix — LSPosed module (system framework scope).
// The Xposed API is provided by the vendored :stub project (compileOnly).
plugins {
    id "com.android.application"
}

android {
    namespace "com.minis.imelandfix"
    compileSdk 34

    defaultConfig {
        applicationId "com.minis.imelandfix"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Real API ships inside the Xposed framework at runtime; compileOnly keeps
    // stub classes out of the APK.
    compileOnly project(":stub")
}

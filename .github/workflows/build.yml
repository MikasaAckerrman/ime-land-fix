name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # NOTE: android-actions/setup-android intentionally omitted — the runner
      # image already ships a full SDK with pre-accepted licenses, and the
      # action tries `sdkmanager tools` which no longer exists and fails the
      # job ("Failed to find package 'tools'").

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -keystore app/debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ime-land-fix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
